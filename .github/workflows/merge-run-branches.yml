# Scheduled Claude runs (Research, Create, Metrics pull, Post, Watchlist) are sometimes only allowed to push to
# their own claude/... branch. This merges such a branch into main as soon as it is pushed, so the dashboard and
# the next run see the work. It only merges branches that wrote a run log record (runlog/), which every scheduled
# run does and code-change branches don't; those still go through a pull request. On a conflict it stops and
# fails, leaving main untouched.
name: Merge run branches into main

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: merge-run-branches
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the run branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if ! git diff --name-only main...FETCH_HEAD | grep -q '^runlog/'; then
            echo "$BRANCH has no run log record, so it isn't a scheduled run. Leaving it for a pull request."
            exit 0
          fi
          if git merge-base --is-ancestor FETCH_HEAD main; then
            echo "Already merged."
            exit 0
          fi
          if ! git merge --no-edit -m "Merge run branch $BRANCH" FETCH_HEAD; then
            git merge --abort
            echo "::error::$BRANCH conflicts with main. Merge it by hand."
            exit 1
          fi
          for i in 1 2 3; do
            git push origin main && exit 0
            sleep 5; git pull --no-rebase --no-edit origin main
          done
          exit 1
